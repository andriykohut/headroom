name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-checks:
    name: Distribution constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # First, and on its own: the promise that this app carries no provider
      # identifiers is what makes publishing it defensible. A build that fails
      # here should not be tested, let alone released.
      - run: ./scripts/check-distribution.sh

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # This job's default working directory is cli/, but the installer
      # lives at the repo root alongside the other release scripts.
      - name: Lint the shell scripts
        working-directory: ${{ github.workspace }}
        run: shellcheck scripts/*.sh

      - name: Test the installer's platform detection
        working-directory: ${{ github.workspace }}
        run: scripts/install.test.sh

      # Includes tests/push_does_not_block.rs, which times the status line hook
      # against a relay that accepts connections and never answers. That one
      # guards a promise the user feels on every prompt, so a slow or contended
      # runner failing it is a signal worth reading, not one worth relaxing.
      - run: cargo test

  app:
    name: App and domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install the compile SDK
        run: sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"

      # basic, not the default 'enhanced': that one loads gradle-actions-caching,
      # a closed-source component under Gradle's commercial Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew :domain:test :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleDebug

      # The suite is the point, but a failure is far easier to read from the
      # HTML report than from Gradle's console output.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
