name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-checks:
    name: Distribution constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First, and on its own: the promise that this app carries no provider
      # identifiers is what makes publishing it defensible. A build that fails
      # here should not be tested, let alone released.
      - run: ./scripts/check-distribution.sh

  generator:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --directory tools pytest -q

  app:
    name: App and domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the compile SDK
        run: sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :domain:test :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleDebug

      # The suite is the point, but a failure is far easier to read from the
      # HTML report than from Gradle's console output.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
